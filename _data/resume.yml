                主要职责：<br/> 1. 数据工程：设计自动化数据清洗 pipeline，定时拉取TB级业务数据->通用规则清洗->FastText知识密度打分->模型辅助质检过滤->Minhash全局去重，日均处理数据量超50万条，有效提升训练数据构造效率，并保障pipeline稳定运行（SLA>99%）；<br/>
