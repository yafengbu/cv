            summary: 项目描述：基于 Qwen 系列基础大模型，构建支持多业务线的企业级领域大模型（含通用公共模型与垂直特性模型），实现从原始业务数据到可调用AI技能的端到端交付，并通过低代码平台赋能非技术用户快速集成。
