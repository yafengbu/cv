            detail:
                主要职责：<br/> 1. 后台开发：负责接入层的开发，即接收业务在关键路径上的请求，对于有风险的操作，执行策略判定，并将结果返回给策略引擎，用于策略的执行和判定，以及后续的打击阻断操作；<br/>
