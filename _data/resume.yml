                3. 高性能部署：基于 vLLM 部署推理服务，将模型能力封装为标准化 API，并集成至公司低代码平台，支持业务方通过拖拽方式快速构建智能问答、文档摘要等 AI 技能，已上线 10+ 内部应用场景；<br/>
                4. 评估体系：支持自定义数据集上传，自动计算 Perplexity、ROUGE、BLEU 及业务相关指标（如术语覆盖率、合规性得分），评估结果自动同步至数据管理平台；同时集成通用 benchmark 用于横向对比，驱动模型选型与迭代决策。
            open: open

          - title: 基于多模态 Agent 的智能文档信息提取系统
            sub: AI应用工程师（主导端到端系统设计与工程落地）
            duration: 2025年2月 - 2025年12月
            tags:
                - 多模态大模型（Qwen-VL）
                - RAG
                - Faiss
                - FastAPI（异步）
            summary: 项目描述：构建支持 PDF/Word/PPT 等格式的智能文档解析 Agent，通过多模态理解与检索增强生成（RAG），自动提取用户指定的关键字段（如合同金额、签署方、手写签名、日期等），输出结构化为 JSON/Markdown，服务于财务、运营商等自动化流程场景。
            detail:
                主要职责：<br/> 1. 文档解析：基于开源工具，结合OCR模型，实现版面感知解析，精准提取文本、图像、页眉页脚、手写签名区域等元信息，输出标准化 JSON，保留原始文档语义结构；<br/>
                2. 多模态RAG：对长文本进行智能切块、每块文本和所有图片分别提取特征向量，并存入Faiss向量库，再基于向量进行检索；筛选并召回 Top-K 最相关的文本和图片，显著提升关键信息定位准确率（对比纯文本 RAG，F1 提升 18%）；<br/>
                3. 大模型总结：借助VL模型（Qwen-VL），使用固定格式的Prompt，引导模型输出 JSON/Markdown 结构的文本；并引入后处理校验机制（如正则匹配、枚举约束），确保输出字段合规性；<br/>
                4. 异步微服务：基于 FastAPI + Uvicorn + HTTPX 构建全联路异步 API 服务，支持高并发文档上传与异步结果轮询（已稳定运行2个月，日均处理文档 6000+ 份，支撑GTS、三大运营商等3个核心业务流程）；<br/>
                5. 联路可观测：集成 Langfuse，对关键环节进行 trace 级埋点，实现每次端到端请求的完整执行链路可视化。

            open: open

          - title: 智能问答 Agent 系统
            sub: AI应用工程师（主导架构设计与核心模块开发）
            duration: 2025年4月 - 2025年12月
            tags:
                - LLM
                - RAG
                - Agent
                - Prompt设计
                - DAG
                - Self-Reflection 机制
            summary: 项目描述：构建支持复杂多跳问题的智能问答系统，通过任务自动拆解 + 有向无环图（DAG）并行调度 + RAG 检索增强 + 反思容错机制，显著提升回答准确性与系统效率，服务于企业知识库问答场景。
            detail:
                主要职责：<br/> 1. 任务拆解：基于 Understanding 模型设计任务拆解 Prompt，将用户输入自动拆解为多个子任务，并输出带依赖关系的 DAG 结构，支持动态子任务类型识别（查询、总结等），拆解准确率 >90%；<br/>
                2. DAG 驱动：自研轻量级 DAG 调度器，根据子任务依赖关系自动并行执行无依赖节点，相比纯串行方案，平均响应时间降低 42% 以上；<br/>
                3. 子任务并行：每个子任务封装为标准单元（Query 改写 → 搜索规划 → 搜索 → 相关性判别  → 召回相关内容）；<br/>
                4. 反思模块：当所有子任务召回为空时，触发一轮反思，回退至用户原始问题上下文，重新进行搜索规划，并执行二次检索，使整体问答成功率从 76% 提升至 88%；<br/>
                5. 总结模块：设计 Prompt 模板，引导 LLM 基于多源召回内容进行逻辑整合与去冗，输出简洁、准确、带引用依据的回答；<br/>
                6. 后处理校验：引入后处理校验（如禁止安全关键词、重复输出适度截止、Markdown格式增强、免责声明等），确保答案可靠性。
            open: open

